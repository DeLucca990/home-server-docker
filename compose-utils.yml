name: utils

x-loopback-address: &loopback-address 127.0.0.1
x-lan-address: &lan-address your.lan.ip.address (access running "ifconfig" command)

x-common: &common
  restart: unless-stopped

services:
  portainer:
    <<: *common
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - ./config/uptime-kuma:/app/data
    ports:
      - host_ip: *loopback-address
        published: "3001"
        target: 3001
      - host_ip: *lan-address
        published: "3001"
        target: 3001

volumes:
  portainer_data: