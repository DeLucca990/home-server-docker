name: media

x-loopback-address: &loopback-address 127.0.0.1
x-lan-address: &lan-address ${LAN_IP:?set LAN_IP in .env - see .env.example}

x-common: &common
  restart: unless-stopped

x-environment: &environment
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-America/Sao_Paulo}

x-healthcheck: &healthcheck
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 90s

services:
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *environment
      GIDLIST: 109
    volumes:
      - ./config/jellyfin:/config
      - ${MEDIA_ROOT:-/home/ubuntu/media}/library:/media/library
    ports:
      - host_ip: *loopback-address
        published: "8096"
        target: 8096
      - host_ip: *lan-address
        published: "8096"
        target: 8096
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *environment
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_ROOT:-/home/ubuntu/media}/torrents:/media/torrents
    ports:
      - host_ip: *loopback-address
        published: "8080"
        target: 8080
      - host_ip: *lan-address
        published: "8080"
        target: 8080
      - 6881:6881
      - 6881:6881/udp
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *environment
    volumes:
      - ./config/prowlarr:/config
    ports:
      - host_ip: *loopback-address
        published: "9696"
        target: 9696
      - host_ip: *lan-address
        published: "9696"
        target: 9696
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *environment
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_ROOT:-/home/ubuntu/media}:/media
    ports:
      - host_ip: *loopback-address
        published: "7878"
        target: 7878
      - host_ip: *lan-address
        published: "7878"
        target: 7878
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/ping"]

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *environment
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_ROOT:-/home/ubuntu/media}:/media
    ports:
      - host_ip: *loopback-address
        published: "8989"
        target: 8989
      - host_ip: *lan-address
        published: "8989"
        target: 8989
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/ping"]

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *environment
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_ROOT:-/home/ubuntu/media}/library:/media/library
    ports:
      - host_ip: *loopback-address
        published: "6767"
        target: 6767
      - host_ip: *lan-address
        published: "6767"
        target: 6767
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/api/system/ping"]

  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - host_ip: *loopback-address
        published: "8191"
        target: 8191
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
