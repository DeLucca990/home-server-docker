x-loopback-address: &loopback-address 127.0.0.1
x-lan-address: &lan-address your.lan.ip.address (access running "ifconfig" command)

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - GIDLIST=109
    volumes:
      - ./config/jellyfin:/config
      - /home/ubuntu/media/library:/media/library
    ports:
      - host_ip: *loopback-address
        published: "8096"
        target: 8096
      - host_ip: *lan-address
        published: "8096"
        target: 8096
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent:/config
      - /home/ubuntu/media/torrents:/media/torrents
    ports:
      - host_ip: *loopback-address
        published: "8080"
        target: 8080
      - host_ip: *lan-address
        published: "8080"
        target: 8080
      - host_ip: *loopback-address
        published: "6881"
        target: 6881
      - host_ip: *lan-address
        published: "6881"
        target: 6881
      - host_ip: *loopback-address
        published: "6881"
        target: 6881
        protocol: udp
      - host_ip: *lan-address
        published: "6881"
        target: 6881
        protocol: udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/prowlarr:/config
    ports:
      - host_ip: *loopback-address
        published: "9696"
        target: 9696
      - host_ip: *lan-address
        published: "9696"
        target: 9696
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/radarr:/config
      - /home/ubuntu/media:/media
    ports:
      - host_ip: *loopback-address
        published: "7878"
        target: 7878
      - host_ip: *lan-address
        published: "7878"
        target: 7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/sonarr:/config
      - /home/ubuntu/media:/media
    ports:
      - host_ip: *loopback-address
        published: "8989"
        target: 8989
      - host_ip: *lan-address
        published: "8989"
        target: 8989
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/bazarr:/config
      - /home/ubuntu/media/library:/media/library
    ports:
      - host_ip: *loopback-address
        published: "6767"
        target: 6767
      - host_ip: *lan-address
        published: "6767"
        target: 6767
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Sao_Paulo
    ports:
      - 8191:8191
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
